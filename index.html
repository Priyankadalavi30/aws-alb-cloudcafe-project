<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cloud Café</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: url('https://images.unsplash.com/photo-1509042239860-f550ce710b93') no-repeat center center/cover;
    color: white;
}

/* DARK OVERLAY */
.overlay {
    background: rgba(0,0,0,0.65);
    min-height: 100vh;
    padding: 30px;
}

/* NAVBAR */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 40px;
}

.logo {
    font-size: 28px;
    font-weight: 700;
    color: #ffcc70;
}

nav button {
    padding: 10px 20px;
    border: none;
    border-radius: 20px;
    background: #ff7b00;
    color: white;
    cursor: pointer;
}

/* HERO */
.hero {
    text-align: center;
    margin-top: 60px;
}

.hero h1 {
    font-size: 60px;
    margin: 0;
    color: #ffcc70;
}

.hero p {
    font-size: 20px;
    margin-top: 10px;
}

/* SERVER BOX */
.server {
    margin-top: 15px;
    font-size: 18px;
    color: #00ffcc;
}

/* MENU */
.menu {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 50px;
    flex-wrap: wrap;
}

.card {
    background: rgba(255,255,255,0.1);
    padding: 20px;
    width: 200px;
    border-radius: 15px;
    text-align: center;
    backdrop-filter: blur(10px);
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
    background: rgba(255,255,255,0.2);
}

/* FOOTER */
footer {
    text-align: center;
    margin-top: 50px;
    padding: 20px;
    font-size: 14px;
    opacity: 0.8;
}
</style>
</head>

<body>

<div class="overlay">

<nav>
    <div class="logo">☕ Cloud Café</div>
    <button>Order Now</button>
</nav>

<div class="hero">
    <h1>Fresh Coffee Experience</h1>
    <p>Premium Taste • Modern Café • AWS Powered</p>

    <!-- 🔥 Dynamic Server Name -->
    <div class="server" id="serverName">Loading server info...</div>
</div>

<div class="menu">
    <div class="card">☕ Cappuccino</div>
    <div class="card">☕ Latte</div>
    <div class="card">☕ Espresso</div>
    <div class="card">☕ Mocha</div>
</div>

<footer>
© 2026 Cloud Café | Built on AWS EC2 + ALB
</footer>

</div>

<script>
fetch("server.txt?ts=" + new Date().getTime())
.then(res => res.text())
.then(data => {
    document.getElementById("serverName").innerText = data;
})
.catch(() => {
    document.getElementById("serverName").innerText = "Server Info Unavailable";
});
</script>

</body>
</html>
